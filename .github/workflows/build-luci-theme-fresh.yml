name: Build LuCI Fresh Theme

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/build-luci-theme-fresh.yml
      - package/luci-theme-fresh/**
      - feeds.conf.default
      - defconfig/cudy-tr3000-v1-stock.config
  pull_request:
    paths:
      - .github/workflows/build-luci-theme-fresh.yml
      - package/luci-theme-fresh/**
      - feeds.conf.default
      - defconfig/cudy-tr3000-v1-stock.config

permissions:
  contents: read

concurrency:
  group: luci-theme-fresh-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile package
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache clang cmake cpio curl \
            device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gnutls-dev gperf haveged help2man intltool \
            lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev \
            libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
            libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm \
            lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch \
            pkgconf python3 python3-pip python3-ply python3-docutils \
            python3-pyelftools qemu-utils re2c rsync scons squashfs-tools \
            subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto \
            u-boot-tools xxd zlib1g-dev zstd

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: luci-theme-fresh-dl-${{ hashFiles('feeds.conf.default', 'package/luci-theme-fresh/Makefile') }}
          restore-keys: luci-theme-fresh-dl-

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure build
        run: |
          cp defconfig/cudy-tr3000-v1-stock.config .config
          make defconfig
          grep -qxF 'CONFIG_PACKAGE_luci-theme-fresh=y' .config

      - name: Compile Fresh theme
        run: |
          if ! make package/luci-theme-fresh/compile -j"$(nproc)"; then
            make package/luci-theme-fresh/compile -j1 V=s
          fi

      - name: Collect package
        run: |
          mapfile -t packages < <(
            find bin/packages -type f \
              \( -name 'luci-theme-fresh_*.ipk' -o -name 'luci-theme-fresh-*.apk' \) \
              -print
          )

          if (( ${#packages[@]} != 1 )); then
            echo "Expected exactly one Fresh theme package, found ${#packages[@]}." >&2
            printf '%s\n' "${packages[@]}" >&2
            exit 1
          fi

          mkdir -p artifacts/luci-theme-fresh
          cp "${packages[0]}" artifacts/luci-theme-fresh/
          (
            cd artifacts/luci-theme-fresh
            sha256sum "$(basename "${packages[0]}")" > sha256sums
          )

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: luci-theme-fresh
          if-no-files-found: error
          retention-days: 14
          path: artifacts/luci-theme-fresh/
